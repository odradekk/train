name: Issue 774 temporary GC attribution
run-name: Issue 774 Linux ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [counters, sample]
        default: counters
      soak_seconds:
        type: string
        default: '1500'
permissions:
  contents: read
jobs:
  measurement:
    runs-on: [self-hosted, linux, nightly]
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Prepare collector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'issue774-tools'
          dotnet tool install dotnet-trace --version 9.0.652701 --allow-roll-forward --tool-path $tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TRAIN_TRACE_EXE=$(Join-Path $tools 'dotnet-trace')" | Add-Content $env:GITHUB_ENV
      - name: Window soak
        shell: pwsh
        env:
          TRAIN_774_MODE: ${{ inputs.mode }}
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force TestResults/issue-774 | Out-Null
          @{
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            commit = (git rev-parse HEAD)
            product_base = 'ee7692e52eac0f578b375bf5f21a2db7935e18d3'
            mode = $env:TRAIN_774_MODE
            sdk = (dotnet --version)
            powershell = $PSVersionTable.PSVersion.ToString()
          } | ConvertTo-Json | Set-Content TestResults/issue-774/identity.json
          & pwsh -NoProfile -File scripts/checks/run-window-soak.ps1 -CacheDirectory (Join-Path $env:RUNNER_TOOL_CACHE 'godot-export-templates/4.7.2-stable') -SoakSeconds $env:SOAK_SECONDS 2>&1 | ForEach-Object {
            $line = $_.ToString()
            foreach ($directory in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE, $env:HOME, $env:DOTNET_ROOT)) {
              if ($directory) { $line = $line.Replace($directory, '<isolated-path>') }
            }
            Write-Host $line
          }
          exit $LASTEXITCODE
      - name: Sanitize text evidence
        if: always()
        shell: pwsh
        run: |
          foreach ($file in @(Get-ChildItem TestResults -File -Recurse -ErrorAction SilentlyContinue | Where-Object Extension -In '.json','.jsonl','.log','.txt')) {
            $text = [IO.File]::ReadAllText($file.FullName)
            foreach ($directory in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE, $env:HOME, $env:DOTNET_ROOT)) {
              if ($directory) { $text = $text.Replace($directory, '<isolated-path>') }
            }
            [IO.File]::WriteAllText($file.FullName, $text)
          }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue774-${{ inputs.mode }}-${{ github.run_id }}
          path: TestResults/
          include-hidden-files: true
          retention-days: 14
      - name: Clean owned workspace
        if: always()
        shell: pwsh
        run: |
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          if ((Get-Location).Path -cne $workspace -or (git rev-parse --show-toplevel) -cne $workspace) { throw 'Unexpected cleanup directory.' }
          git clean -ffdx
          exit $LASTEXITCODE
