name: Windows checks
run-name: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || inputs.selection == 'nightly' || inputs.selection == 'long-example' || inputs.selection == 'window-soak' || inputs.selection == 'hardware-probe') && 'Linux' || 'Windows' }} ${{ github.event_name == 'push' && 'post-merge' || github.event_name == 'schedule' && 'nightly' || inputs.selection || (github.event.action == 'labeled' && github.event.label.name == 'ci:correctness' && 'correctness') || (github.event.action == 'labeled' && 'unrelated-label') || 'routine' }} ${{ inputs.selection == 'long-example' && inputs.example || '' }} · ${{ github.event.pull_request.head.sha || inputs.commit || github.sha }}

on:
  push:
    branches: [master]
  schedule:
    - cron: '23 20 * * *' # 04:23 Asia/Shanghai
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      selection:
        description: Check selection
        type: choice
        options: [routine, correctness, nightly, long-example, window-soak, hardware-probe]
        default: routine
      example:
        description: Long example (used only by long-example)
        type: choice
        options: [starting-trade, lease-expiry, rail-repair, conquest, clearance, operating-failure, long-consist, standard-world]
        default: starting-trade
      commit:
        description: 要测试的完整 40 位提交 SHA，留空则测试触发的 ref
        type: string
        required: false

permissions:
  contents: read

jobs:
  checks:
    name: Windows ${{ inputs.selection || (github.event.action == 'labeled' && github.event.label.name == 'ci:correctness' && 'correctness') || (github.event.action == 'labeled' && 'unrelated-label') || 'routine' }}
    # A label is a one-shot request; leaving it on a PR does not make pushes heavy.
    if: (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'ci:correctness')) || (github.event_name == 'workflow_dispatch' && (inputs.selection == 'routine' || inputs.selection == 'correctness'))
    runs-on: windows-2025
    timeout-minutes: 115
    env:
      CI_SELECTION: ${{ inputs.selection || (github.event.action == 'labeled' && github.event.label.name == 'ci:correctness' && 'correctness') || 'routine' }}
    steps:
      - name: Checkout tested head
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare PowerShell 7.6.6
        id: powershell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path TestResults/ci -Force | Out-Null
          @"
          run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          attempt=$env:GITHUB_RUN_ATTEMPT
          event=$env:GITHUB_EVENT_NAME
          selection=$env:CI_SELECTION
          head=$(git rev-parse HEAD)
          workflow=$env:GITHUB_SHA
          runner=$env:RUNNER_OS/$env:RUNNER_ARCH
          image=$env:ImageOS/$env:ImageVersion
          "@ | Set-Content TestResults/ci/environment.txt
          $archive = Join-Path $env:RUNNER_TEMP 'powershell.zip'
          Invoke-WebRequest 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860') { throw 'PowerShell archive SHA256 mismatch' }
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP/pwsh"
          "$env:RUNNER_TEMP/pwsh" | Add-Content $env:GITHUB_PATH

      - name: Prepare locked .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Prepare Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Restore locked .NET tools
        shell: pwsh
        run: dotnet tool restore

      - name: Install Schema validator
        shell: pwsh
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Record tool versions
        if: ${{ !cancelled() && steps.powershell.outcome == 'success' }}
        shell: pwsh
        run: |
          "powershell=$($PSVersionTable.PSVersion)" | Add-Content TestResults/ci/environment.txt
          "dotnet=$(dotnet --version)" | Add-Content TestResults/ci/environment.txt

      # Only forward explicit selections. The entry owns discovery, preparation,
      # assertions, evidence and exit status, including missing prerequisites.
      - name: Routine fast and integration checks
        if: ${{ !cancelled() && steps.powershell.outcome == 'success' && env.CI_SELECTION == 'routine' }}
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/pwsh/pwsh.exe" -NoProfile -File scripts/test.ps1 -Layer fast,integration
          exit $LASTEXITCODE

      - name: Prepare Godot 4.7.2 .NET
        if: ${{ !cancelled() && steps.powershell.outcome == 'success' }}
        continue-on-error: ${{ env.CI_SELECTION == 'routine' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CI_SELECTION -eq 'routine') {
            try {
              $summaries = @(Get-ChildItem TestResults -Directory -ErrorAction Stop |
                Where-Object Name -Match '^fast-integration-\d{8}T\d{9}-[0-9a-f]{7}$' |
                ForEach-Object { Join-Path $_.FullName 'summary.json' })
              if ($summaries.Count -ne 1) { throw 'Expected one routine fast/integration summary.' }
              $summary = Get-Content -LiteralPath $summaries[0] -Raw | ConvertFrom-Json
              if ($summary.selection.engine -isnot [bool]) { throw 'Summary has no Boolean engine selection.' }
              if (-not $summary.selection.engine) {
                Write-Host 'Engine not selected by the unified entry; skipping Godot download.'
                exit 0
              }
              Write-Host 'Engine selected by the unified entry; preparing Godot.'
            } catch {
              Write-Host "Cannot read engine selection; preparing Godot: $($_.Exception.Message)"
            }
          }
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'a2a48473a7414c5f19fab690518caebb738c09ef9601f6bd2388676a7f53b3c0') { throw 'Godot archive SHA256 mismatch' }
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP/godot"
          $godot = "$env:RUNNER_TEMP/godot/Godot_v4.7.2-stable_mono_win64/Godot_v4.7.2-stable_mono_win64_console.exe"
          "GODOT=$godot" | Add-Content $env:GITHUB_ENV
          "godot=$(& $godot --headless --version)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Routine engine checks (non-blocking)
        if: ${{ !cancelled() && steps.powershell.outcome == 'success' && env.CI_SELECTION == 'routine' }}
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/pwsh/pwsh.exe" -NoProfile -File scripts/test.ps1 -Layer engine
          exit $LASTEXITCODE

      - name: Explicit correctness regression
        if: ${{ !cancelled() && steps.powershell.outcome == 'success' && env.CI_SELECTION == 'correctness' }}
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/pwsh/pwsh.exe" -NoProfile -File scripts/test.ps1 -All -Layer all
          exit $LASTEXITCODE

      - name: Publish available reports
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Directory -ErrorAction SilentlyContinue |
            Where-Object Name -Match '^[a-z-]+-\d{8}T\d{9}-[0-9a-f]{7}$' |
            ForEach-Object {
              $summary = Join-Path $_.FullName 'summary.json'
              if (Test-Path -LiteralPath $summary) {
                "### $($_.Name)" | Add-Content $env:GITHUB_STEP_SUMMARY
                '```json' | Add-Content $env:GITHUB_STEP_SUMMARY
                Get-Content -LiteralPath $summary -Raw | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
              }
            }

      - name: Upload available evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ env.CI_SELECTION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  nightly:
    name: Linux ${{ github.event_name == 'push' && 'post-merge' || inputs.selection || 'nightly' }} ${{ inputs.selection == 'long-example' && inputs.example || '' }}
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && (inputs.selection == 'nightly' || inputs.selection == 'long-example' || inputs.selection == 'window-soak' || inputs.selection == 'hardware-probe'))
    runs-on: [self-hosted, linux, nightly]
    timeout-minutes: ${{ inputs.selection == 'long-example' && (inputs.example == 'lease-expiry' && 485 || 105) || inputs.selection == 'window-soak' && 200 || inputs.selection == 'hardware-probe' && 15 || 153 }}
    permissions:
      contents: read
    env:
      CI_SELECTION: ${{ inputs.selection || 'nightly' }}
      LONG_EXAMPLE: ${{ inputs.example }}
    steps:
      - name: Checkout tested head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare locked .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet

      - name: Record runner environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path TestResults/ci -Force | Out-Null
          @"
          run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          attempt=$env:GITHUB_RUN_ATTEMPT
          event=$env:GITHUB_EVENT_NAME
          selection=$env:CI_SELECTION
          workflow=$env:GITHUB_SHA
          runner=$env:RUNNER_OS/$env:RUNNER_ARCH
          powershell=$($PSVersionTable.PSVersion)
          "@ | Set-Content TestResults/ci/environment.txt
          "head=$(git rev-parse HEAD)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "dotnet=$(dotnet --version)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "DOTNET_ROOT=$env:DOTNET_ROOT" | Add-Content TestResults/ci/environment.txt
          "godot=$(& $env:GODOT --headless --version)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Command python, python3 -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.Name)=$($_.Source)" | Add-Content TestResults/ci/environment.txt }
          "python3=$(python3 --version)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "jsonschema=$(python3 -c 'import importlib.metadata; print(importlib.metadata.version("jsonschema"))')" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore locked .NET tools
        if: env.CI_SELECTION == 'nightly'
        shell: pwsh
        run: dotnet tool restore

      - name: All correctness and stage checks
        if: env.CI_SELECTION == 'nightly'
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/test.ps1 -All -Layer all,stage
          exit $LASTEXITCODE

      - name: Long example validation
        if: env.CI_SELECTION == 'long-example'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'long-example'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          foreach ($name in @('run-long-example.ps1', 'Invoke-HiddenProcess.ps1')) {
            $source = git show "$($env:GITHUB_SHA):scripts/checks/$name"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $source | Set-Content -LiteralPath (Join-Path $directory $name) -Encoding utf8
          }
          pwsh -NoProfile -File (Join-Path $directory 'run-long-example.ps1') -Example $env:LONG_EXAMPLE -Root $env:GITHUB_WORKSPACE
          exit $LASTEXITCODE

      # The test machine's live desktop session provides the real 1080p window; see docs/ci.md.
      - name: Window soak
        if: env.CI_SELECTION == 'window-soak'
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/checks/run-window-soak.ps1 -CacheDirectory (Join-Path $env:RUNNER_TOOL_CACHE 'godot-export-templates/4.7.2-stable')
          exit $LASTEXITCODE

      # Temporary for #397: records GPU, driver and display before the window soak is designed.
      # The repository is public, so the output omits host, network and user identities.
      - name: Hardware probe
        if: env.CI_SELECTION == 'hardware-probe'
        shell: bash
        run: |
          set +e
          root="$RUNNER_TEMP/hardware-probe"
          rm -rf "$root"
          mkdir -p "$root/project" "$root/xdg/config" "$root/xdg/data" "$root/xdg/cache" TestResults/ci
          raw="$root/hardware.txt"
          p() { printf '\n### %s\n' "$1"; timeout 60 bash -c "$1" 2>&1; echo "(exit $?)"; }
          {
            p 'uname -srvmo'
            p 'cat /etc/os-release'
            p 'lscpu'
            p 'free -h'
            p 'df -h --output=size,used,avail,pcent "$GITHUB_WORKSPACE" /tmp'
            p 'lspci -nnk | grep -EA3 "VGA|3D|Display"'
            p 'lsmod | grep -E "^(nvidia|amdgpu|i915|xe|nouveau|radeon)"'
            p 'nvidia-smi'
            p 'cat /proc/driver/nvidia/version'
            p 'ls -l /dev/dri'
            p 'groups=" $(id -Gn) "; for g in video render; do case "$groups" in *" $g "*) echo "$g: member";; *) echo "$g: not member";; esac; done'
            p 'vulkaninfo --summary | grep -vi uuid'
            p 'ls /usr/share/vulkan/icd.d /etc/vulkan/icd.d'
            p 'eglinfo -B'
            p 'glxinfo -B'
            p 'echo "DISPLAY=${DISPLAY-} WAYLAND_DISPLAY=${WAYLAND_DISPLAY-} XDG_SESSION_TYPE=${XDG_SESSION_TYPE-} XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR-}"'
            p 'ls /tmp/.X11-unix'
            p 'find /run/user -maxdepth 2 -name "wayland-*"'
            p 'loginctl list-sessions --no-legend | wc -l; for s in $(loginctl list-sessions --no-legend | awk "{print \$1}"); do loginctl show-session "$s" -p Type -p Class -p Seat -p State -p Remote; echo; done'
            p 'ps -eo comm= | grep -Ei "^(xorg|xwayland|gnome-shell|kwin_wayland|kwin_x11|sway|weston|cage|gamescope|gdm|gdm3|sddm|lightdm)$" | sort | uniq -c'
            p 'for t in Xvfb xvfb-run Xorg weston sway cage gamescope xrandr vulkaninfo glxinfo eglinfo nvidia-smi; do command -v "$t" >/dev/null && echo "$t: present" || echo "$t: missing"; done'
            p '"$GODOT" --headless --version'
            p 'ls "${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates"'
            p 'sudo -n true && echo "sudo: passwordless" || echo "sudo: unavailable"'
          } > "$raw"

          cat > "$root/project/project.godot" <<'EOF'
          config_version=5

          [application]
          config/name="hardware-probe"
          run/main_scene="res://probe.tscn"
          EOF
          cat > "$root/project/probe.tscn" <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://probe.gd" id="1"]

          [node name="Probe" type="Node3D"]
          script = ExtResource("1")
          EOF
          cat > "$root/project/probe.gd" <<'EOF'
          extends Node3D

          var frames := 0
          var start := 0

          func _ready() -> void:
              var adapter := RenderingServer.get_video_adapter_name()
              var type := RenderingServer.get_video_adapter_type()
              print("adapter=", adapter)
              print("vendor=", RenderingServer.get_video_adapter_vendor())
              print("api=", RenderingServer.get_video_adapter_api_version())
              print("adapter_type=", type)
              print("driver=", RenderingServer.get_current_rendering_driver_name(), " method=", RenderingServer.get_current_rendering_method())
              print("display=", DisplayServer.get_name())
              print("screen=", DisplayServer.screen_get_size(), " refresh=", DisplayServer.screen_get_refresh_rate())
              print("window=", get_window().size, " viewport=", get_viewport().get_visible_rect().size)
              var name := adapter.to_lower()
              var software := type == RenderingDevice.DEVICE_TYPE_CPU or name.contains("llvmpipe") or name.contains("lavapipe") or name.contains("softpipe") or name.contains("swiftshader")
              print("software=", software)
              start = Time.get_ticks_msec()

          func _process(_delta: float) -> void:
              frames += 1
              var elapsed := Time.get_ticks_msec() - start
              if elapsed >= 5000:
                  print("frames=", frames, " fps=", frames * 1000.0 / elapsed)
                  get_tree().quit()
          EOF

          render() {
            local label="$1" driver="$2"
            shift 2
            printf '\n### render: %s\n' "$label"
            XDG_CONFIG_HOME="$root/xdg/config" XDG_DATA_HOME="$root/xdg/data" XDG_CACHE_HOME="$root/xdg/cache" \
              timeout 60 "$@" "$GODOT" --path "$root/project" --display-driver "$driver" \
              --rendering-method forward_plus --rendering-driver vulkan --resolution 1920x1080 2>&1
            echo "(exit $?)"
          }
          {
            displays=()
            [ -n "${DISPLAY-}" ] && displays+=("$DISPLAY")
            for socket in /tmp/.X11-unix/X*; do [ -S "$socket" ] && displays+=(":${socket##*/X}"); done
            [ ${#displays[@]} -eq 0 ] && printf '\n### render: no X display found\n'
            for display in $(printf '%s\n' "${displays[@]}" | sort -u); do render "x11 $display" x11 env DISPLAY="$display"; done
            for socket in /run/user/*/wayland-*; do [ -S "$socket" ] && render "wayland ${socket##*/}" wayland env XDG_RUNTIME_DIR="${socket%/*}" WAYLAND_DISPLAY="${socket##*/}"; done
            command -v xvfb-run >/dev/null && render "xvfb-run (software only)" x11 xvfb-run -a -s "-screen 0 1920x1080x24"
          } >> "$raw"

          sed -e "s|$(id -un)|<user>|g" -e "s|$(cat /proc/sys/kernel/hostname)|<host>|g" "$raw" > TestResults/ci/hardware.txt
          cat TestResults/ci/hardware.txt
          rm -rf "$root"

      - name: Publish available reports
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Directory -ErrorAction SilentlyContinue |
            Where-Object Name -Match '^[a-z-]+-\d{8}T\d{9}-[0-9a-f]{7}$' |
            ForEach-Object {
              $summary = Join-Path $_.FullName 'summary.json'
              if (Test-Path -LiteralPath $summary) {
                "### $($_.Name)" | Add-Content $env:GITHUB_STEP_SUMMARY
                '```json' | Add-Content $env:GITHUB_STEP_SUMMARY
                Get-Content -LiteralPath $summary -Raw | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
              }
            }

      - name: Upload available evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ github.event_name == 'push' && 'post-merge' || env.CI_SELECTION }}${{ inputs.selection == 'long-example' && format('-{0}', inputs.example) || '' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Clean runner workspace
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          if ((Get-Location).Path -cne $workspace) { throw 'Cleanup requires the current GitHub workspace directory.' }
          $repository = git rev-parse --show-toplevel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Resolve-Path -LiteralPath $repository).Path -cne $workspace) { throw 'Cleanup requires the GitHub workspace repository root.' }
          git clean -ffdx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -LiteralPath $workspace -Force | Format-Table Mode, Name
