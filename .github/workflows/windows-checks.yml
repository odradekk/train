name: Opening diagnostics
run-name: Linux opening diagnostics · ${{ inputs.commit || github.sha }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 要测量的完整提交 SHA，留空则测量触发的 diag ref
        type: string
        required: false

permissions:
  contents: read

jobs:
  measure:
    name: Linux opening diagnostics
    if: github.ref == 'refs/heads/diag-862-opening'
    runs-on: [self-hosted, linux, nightly]
    timeout-minutes: 720
    env:
      CI_SELECTION: measure
    steps:
      - name: Mask runner host identity
        shell: bash
        run: |
          values=("$HOME" "$(id -un)" "$(uname -n)" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE")
          if [ -n "$RUNNER_WORKSPACE" ]; then values+=("$(dirname "$(dirname "$RUNNER_WORKSPACE")")"); fi
          if [ -n "$GODOT" ]; then values+=("$(dirname "$GODOT")"); fi
          if pwsh_path="$(command -v pwsh)"; then
            values+=("$(dirname "$pwsh_path")" "$(dirname "$(readlink -f "$pwsh_path")")")
          fi
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done

      - name: Checkout tested head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare publication and measurement scripts from workflow commit
        id: tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'measure-tools'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          git archive --format=tar --output="$directory/scripts.tar" $env:GITHUB_SHA scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf "$directory/scripts.tar" -C $directory
          exit $LASTEXITCODE

      - name: Prepare locked .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet

      - name: Record runner environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path TestResults/ci -Force | Out-Null
          @"
          run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          attempt=$env:GITHUB_RUN_ATTEMPT
          event=$env:GITHUB_EVENT_NAME
          selection=$env:CI_SELECTION
          workflow=$env:GITHUB_SHA
          runner=$env:RUNNER_OS/$env:RUNNER_ARCH
          powershell=$($PSVersionTable.PSVersion)
          "@ | Set-Content TestResults/ci/environment.txt
          "head=$(git rev-parse HEAD)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "dotnet=$(dotnet --version)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "godot=$(& $env:GODOT --headless --version)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "python3=$(python3 --version)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "jsonschema=$(python3 -c 'import importlib.metadata; print(importlib.metadata.version("jsonschema"))')" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Measure opening scenarios
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/measure-tools/scripts/measure/run-measurement.ps1" -Scenario 'scene-node,scene-edge' -InputSet example -InputPath 'examples/standard-world/save.json' -Repeat 5 -DurationSeconds 0 -NodeReadyHold:$false -StreamingDiagnostics -Root $env:GITHUB_WORKSPACE -CacheDirectory (Join-Path $env:RUNNER_TOOL_CACHE 'godot-export-templates/4.7.2-stable')
          exit $LASTEXITCODE

      - name: Publish available reports
        id: publish
        if: always() && steps.tools.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:RUNNER_TEMP/measure-tools/scripts/measure/publish-measurement.ps1" -Directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem TestResults -Directory -ErrorAction SilentlyContinue |
            Where-Object Name -Match '^[a-z-]+-\d{8}T\d{9}-[0-9a-f]{7}$' |
            ForEach-Object {
              $summary = Join-Path $_.FullName 'summary.json'
              if (Test-Path -LiteralPath $summary) {
                "### $($_.Name)" | Add-Content $env:GITHUB_STEP_SUMMARY
                '```json' | Add-Content $env:GITHUB_STEP_SUMMARY
                Get-Content -LiteralPath $summary -Raw | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
              }
            }

      - name: Upload available evidence
        if: always() && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-opening-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Clean runner workspace
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          if ((Get-Location).Path -cne $workspace) { throw 'Cleanup requires the current GitHub workspace directory.' }
          $repository = git rev-parse --show-toplevel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Resolve-Path -LiteralPath $repository).Path -cne $workspace) { throw 'Cleanup requires the GitHub workspace repository root.' }
          git clean -ffdx *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
