name: Third-slot opening A-B
run-name: Third-slot A-B · ${{ inputs.commit || github.sha }}
on:
  workflow_dispatch:
    inputs:
      commit:
        description: B 的完整 40 位 SHA；留空使用触发的实验分支提交
        type: string
        required: false
permissions:
  contents: read
jobs:
  measure:
    if: github.ref == 'refs/heads/exp-862-third-slot'
    runs-on: [self-hosted, linux, nightly]
    timeout-minutes: 720
    env:
      CI_SELECTION: measure
      B_COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - name: Mask runner identity
        shell: bash
        run: |
          values=("$HOME" "$(id -un)" "$(uname -n)" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE")
          if [ -n "$RUNNER_WORKSPACE" ]; then values+=("$(dirname "$(dirname "$RUNNER_WORKSPACE")")"); fi
          if [ -n "$GODOT" ]; then values+=("$(dirname "$GODOT")"); fi
          if pwsh_path="$(command -v pwsh)"; then values+=("$(dirname "$pwsh_path")" "$(dirname "$(readlink -f "$pwsh_path")")"); fi
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
      - name: Checkout workflow tools
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare measurement tools
        id: tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:B_COMMIT -notmatch '^[0-9a-fA-F]{40}$') { throw 'B must be a complete commit SHA.' }
          $directory = Join-Path $env:RUNNER_TEMP "third-slot-tools-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          git archive --format=tar --output="$directory/scripts.tar" $env:GITHUB_SHA scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf "$directory/scripts.tar" -C $directory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "MEASURE_TOOLS=$directory" | Add-Content $env:GITHUB_ENV
      - name: Prepare locked SDK
        id: sdk
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Checkout A
        id: checkout_A
        if: always() && !cancelled() && steps.tools.outcome == 'success' && steps.sdk.outcome == 'success'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 2616066dfc53bac614a83f3bc2057376b6df6530
          path: A
          fetch-depth: 0
          persist-credentials: false
      - name: Export and measure A
        if: always() && !cancelled() && steps.checkout_A.outcome == 'success'
        shell: pwsh
        run: |
          & "$env:MEASURE_TOOLS/scripts/measure/run-measurement.ps1" -Scenario 'scene-node,scene-edge' -InputSet example -InputPath 'examples/standard-world/save.json' -Repeat 5 -DurationSeconds 0 -NodeReadyHold:$false -Root (Join-Path $env:GITHUB_WORKSPACE 'A') -CacheDirectory (Join-Path $env:RUNNER_TOOL_CACHE 'godot-export-templates/4.7.2-stable')
          exit $LASTEXITCODE
      - name: Sanitize A evidence
        id: publish_A
        if: always() && steps.tools.outcome == 'success' && steps.checkout_A.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Join-Path $env:GITHUB_WORKSPACE 'A/TestResults'
          if (-not (Test-Path -LiteralPath $results)) { throw 'No measurement evidence was produced.' }
          & "$env:MEASURE_TOOLS/scripts/measure/publish-measurement.ps1" -Directory $results
          exit $LASTEXITCODE
      - name: Upload A evidence
        if: always() && steps.publish_A.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: third-slot-A-${{ github.run_id }}-${{ github.run_attempt }}
          path: A/TestResults/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Checkout B
        id: checkout_B
        if: always() && !cancelled() && steps.tools.outcome == 'success' && steps.sdk.outcome == 'success'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.commit || github.sha }}
          path: B
          fetch-depth: 0
          persist-credentials: false
      - name: Export and measure B
        if: always() && !cancelled() && steps.checkout_B.outcome == 'success'
        shell: pwsh
        run: |
          & "$env:MEASURE_TOOLS/scripts/measure/run-measurement.ps1" -Scenario 'scene-node,scene-edge' -InputSet example -InputPath 'examples/standard-world/save.json' -Repeat 5 -DurationSeconds 0 -NodeReadyHold:$false -Root (Join-Path $env:GITHUB_WORKSPACE 'B') -CacheDirectory (Join-Path $env:RUNNER_TOOL_CACHE 'godot-export-templates/4.7.2-stable')
          exit $LASTEXITCODE
      - name: Sanitize B evidence
        id: publish_B
        if: always() && steps.tools.outcome == 'success' && steps.checkout_B.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Join-Path $env:GITHUB_WORKSPACE 'B/TestResults'
          if (-not (Test-Path -LiteralPath $results)) { throw 'No measurement evidence was produced.' }
          & "$env:MEASURE_TOOLS/scripts/measure/publish-measurement.ps1" -Directory $results
          exit $LASTEXITCODE
      - name: Upload B evidence
        if: always() && steps.publish_B.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: third-slot-B-${{ github.run_id }}-${{ github.run_attempt }}
          path: B/TestResults/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Clean runner workspace
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          if ((Get-Location).Path -cne $workspace) { throw 'Cleanup requires the workspace directory.' }
          $repository = git rev-parse --show-toplevel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Resolve-Path -LiteralPath $repository).Path -cne $workspace) { throw 'Cleanup requires the workspace repository root.' }
          git clean -ffdx *> $null
          exit $LASTEXITCODE
