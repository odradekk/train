name: Windows checks
run-name: ${{ (github.event_name == 'schedule' || inputs.selection == 'nightly') && 'Linux' || 'Windows' }} ${{ github.event_name == 'schedule' && 'nightly' || inputs.selection || (github.event.action == 'labeled' && github.event.label.name == 'ci:correctness' && 'correctness') || (github.event.action == 'labeled' && 'unrelated-label') || 'routine' }} · ${{ github.event.pull_request.head.sha || github.sha }}

on:
  schedule:
    - cron: '23 20 * * *' # 04:23 Asia/Shanghai
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      selection:
        description: Check selection
        type: choice
        options: [routine, correctness, nightly]
        default: routine

permissions:
  contents: read

jobs:
  checks:
    name: Windows ${{ inputs.selection || (github.event.action == 'labeled' && github.event.label.name == 'ci:correctness' && 'correctness') || (github.event.action == 'labeled' && 'unrelated-label') || 'routine' }}
    # A label is a one-shot request; leaving it on a PR does not make pushes heavy.
    if: github.event_name != 'schedule' && inputs.selection != 'nightly' && (github.event.action != 'labeled' || github.event.label.name == 'ci:correctness')
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI_SELECTION: ${{ inputs.selection || (github.event.action == 'labeled' && github.event.label.name == 'ci:correctness' && 'correctness') || 'routine' }}
    steps:
      - name: Checkout tested head
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare PowerShell 7.6.6
        id: powershell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path TestResults/ci -Force | Out-Null
          @"
          run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          attempt=$env:GITHUB_RUN_ATTEMPT
          event=$env:GITHUB_EVENT_NAME
          selection=$env:CI_SELECTION
          head=$(git rev-parse HEAD)
          runner=$env:RUNNER_OS/$env:RUNNER_ARCH
          image=$env:ImageOS/$env:ImageVersion
          "@ | Set-Content TestResults/ci/environment.txt
          $archive = Join-Path $env:RUNNER_TEMP 'powershell.zip'
          Invoke-WebRequest 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860') { throw 'PowerShell archive SHA256 mismatch' }
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP/pwsh"
          "$env:RUNNER_TEMP/pwsh" | Add-Content $env:GITHUB_PATH

      - name: Prepare locked .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Prepare Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Restore locked .NET tools
        shell: pwsh
        run: dotnet tool restore

      - name: Install Schema validator
        shell: pwsh
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Record tool versions
        if: ${{ !cancelled() && steps.powershell.outcome == 'success' }}
        shell: pwsh
        run: |
          "powershell=$($PSVersionTable.PSVersion)" | Add-Content TestResults/ci/environment.txt
          "dotnet=$(dotnet --version)" | Add-Content TestResults/ci/environment.txt

      - name: Prepare Godot 4.7.2 .NET
        if: ${{ !cancelled() && steps.powershell.outcome == 'success' }}
        continue-on-error: ${{ env.CI_SELECTION == 'routine' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_win64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'a2a48473a7414c5f19fab690518caebb738c09ef9601f6bd2388676a7f53b3c0') { throw 'Godot archive SHA256 mismatch' }
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP/godot"
          $godot = "$env:RUNNER_TEMP/godot/Godot_v4.7.2-stable_mono_win64/Godot_v4.7.2-stable_mono_win64_console.exe"
          "GODOT=$godot" | Add-Content $env:GITHUB_ENV
          "godot=$(& $godot --headless --version)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Only forward explicit selections. The entry owns discovery, preparation,
      # assertions, evidence and exit status, including missing prerequisites.
      - name: Routine fast and integration checks
        if: ${{ !cancelled() && steps.powershell.outcome == 'success' && env.CI_SELECTION == 'routine' }}
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/pwsh/pwsh.exe" -NoProfile -File scripts/test.ps1 -Layer fast,integration
          exit $LASTEXITCODE

      - name: Routine engine checks (non-blocking)
        if: ${{ !cancelled() && steps.powershell.outcome == 'success' && env.CI_SELECTION == 'routine' }}
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/pwsh/pwsh.exe" -NoProfile -File scripts/test.ps1 -Layer engine
          exit $LASTEXITCODE

      - name: Explicit correctness regression
        if: ${{ !cancelled() && steps.powershell.outcome == 'success' && env.CI_SELECTION == 'correctness' }}
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/pwsh/pwsh.exe" -NoProfile -File scripts/test.ps1 -All -Layer all
          exit $LASTEXITCODE

      - name: Publish available reports
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Directory -ErrorAction SilentlyContinue |
            Where-Object Name -Match '^[a-z-]+-\d{8}T\d{9}-[0-9a-f]{7}$' |
            ForEach-Object {
              $summary = Join-Path $_.FullName 'summary.json'
              if (Test-Path -LiteralPath $summary) {
                "### $($_.Name)" | Add-Content $env:GITHUB_STEP_SUMMARY
                '```json' | Add-Content $env:GITHUB_STEP_SUMMARY
                Get-Content -LiteralPath $summary -Raw | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
              }
            }

      - name: Upload available evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ env.CI_SELECTION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  nightly:
    name: Linux nightly
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.selection == 'nightly')
    runs-on: [self-hosted, linux, nightly]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout tested head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record runner environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path TestResults/ci -Force | Out-Null
          @"
          run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          attempt=$env:GITHUB_RUN_ATTEMPT
          event=$env:GITHUB_EVENT_NAME
          selection=nightly
          runner=$env:RUNNER_OS/$env:RUNNER_ARCH
          powershell=$($PSVersionTable.PSVersion)
          "@ | Set-Content TestResults/ci/environment.txt
          "head=$(git rev-parse HEAD)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "dotnet=$(dotnet --version)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "godot=$(& $env:GODOT --headless --version)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Command python, python3 -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.Name)=$($_.Source)" | Add-Content TestResults/ci/environment.txt }
          "python3=$(python3 --version)" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "jsonschema=$(python3 -c 'import importlib.metadata; print(importlib.metadata.version("jsonschema"))')" | Add-Content TestResults/ci/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore locked .NET tools
        shell: pwsh
        run: dotnet tool restore

      - name: All fast, integration and headless engine checks
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/test.ps1 -All -Layer all
          exit $LASTEXITCODE
      # Connect the Linux stage selection after #411 merges and stage is available.

      - name: Publish available reports
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Directory -ErrorAction SilentlyContinue |
            Where-Object Name -Match '^[a-z-]+-\d{8}T\d{9}-[0-9a-f]{7}$' |
            ForEach-Object {
              $summary = Join-Path $_.FullName 'summary.json'
              if (Test-Path -LiteralPath $summary) {
                "### $($_.Name)" | Add-Content $env:GITHUB_STEP_SUMMARY
                '```json' | Add-Content $env:GITHUB_STEP_SUMMARY
                Get-Content -LiteralPath $summary -Raw | Add-Content $env:GITHUB_STEP_SUMMARY
                '```' | Add-Content $env:GITHUB_STEP_SUMMARY
              }
            }

      - name: Upload available evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Clean runner workspace
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path
          if ((Get-Location).Path -cne $workspace) { throw 'Cleanup requires the current GitHub workspace directory.' }
          $repository = git rev-parse --show-toplevel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Resolve-Path -LiteralPath $repository).Path -cne $workspace) { throw 'Cleanup requires the GitHub workspace repository root.' }
          git clean -ffdx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -LiteralPath $workspace -Force | Format-Table Mode, Name
