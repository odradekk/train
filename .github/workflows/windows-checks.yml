name: Temporary Issue 873 heap diagnosis
run-name: Linux heap diagnosis · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      selection:
        type: choice
        options: [heap-diagnose]
        default: heap-diagnose

permissions:
  contents: read

jobs:
  diagnosis:
    if: github.event_name == 'workflow_dispatch' && inputs.selection == 'heap-diagnose'
    runs-on: [self-hosted, linux, nightly]
    timeout-minutes: 60
    steps:
      - name: Mask runner identity
        shell: bash
        run: |
          echo "HEAP_RUN_DIRECTORY=$RUNNER_TEMP/issue-873-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          values=("$HOME" "$(id -un)" "$(uname -n)" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$RUNNER_TOOL_CACHE")
          if [ -n "$RUNNER_WORKSPACE" ]; then values+=("$(dirname "$(dirname "$RUNNER_WORKSPACE")")"); fi
          if [ -n "$GODOT" ]; then values+=("$(dirname "$GODOT")"); fi
          if pwsh_path="$(command -v pwsh)"; then
            values+=("$(dirname "$pwsh_path")" "$(dirname "$(readlink -f "$pwsh_path")")")
          fi
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done

      - name: Checkout diagnostic head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare locked .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet

      - name: Observe three reloads and collect GC graphs
        timeout-minutes: 54
        shell: bash
        run: |
          python3 scripts/measure/issue-873-heap.py \
            --gcdump \
            --scratch "$HEAP_RUN_DIRECTORY" \
            --output TestResults/issue-873-diagnosis \
            --cache "$RUNNER_TOOL_CACHE/train-measure"

      - name: Delete private diagnostic files
        if: always()
        shell: bash
        run: |
          target="$(realpath -m "$HEAP_RUN_DIRECTORY")"
          parent="$(realpath -m "$RUNNER_TEMP")"
          case "$target" in
            "$parent"/issue-873-*) rm -rf -- "$target" ;;
            *) echo 'Diagnostic cleanup path rejected'; exit 1 ;;
          esac

      - name: Scan publication allowlist
        id: publish
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath TestResults/issue-873-diagnosis)) { exit 1 }
          & ./scripts/measure/publish-measurement.ps1 -Directory TestResults/issue-873-diagnosis
          exit $LASTEXITCODE

      - name: Echo scanned observations
        if: always()
        shell: pwsh
        env:
          PUBLICATION_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          if ($env:PUBLICATION_OUTCOME -ne 'success') {
            Write-Host 'Publication scan did not pass; no text echoed.'
            exit 0
          }
          $directory = 'TestResults/issue-873-diagnosis'
          foreach ($name in @('acquisition.json', 'timeline.md', 'heap-observations.jsonl', 'collections.jsonl', 'gc-difference.json')) {
            $file = Join-Path $directory $name
            if (Test-Path -LiteralPath $file) {
              Write-Host "::group::$name"
              Get-Content -LiteralPath $file | ForEach-Object { Write-Host $_ }
              Write-Host '::endgroup::'
            }
          }
          foreach ($cycle in @(1, 3)) {
            $file = Join-Path $directory "snapshot-$cycle/gc-heap.json"
            if (Test-Path -LiteralPath $file) {
              Write-Host "::group::snapshot-$cycle GC summary"
              $heap = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
              $heap | Select-Object Summary, Completeness, RootCategories, ContentViews, Arrays |
                ConvertTo-Json -Depth 100 | ForEach-Object { Write-Host $_ }
              Write-Host '::endgroup::'
            }
          }
          $processIds = [System.Collections.Generic.HashSet[int]]::new()
          $observations = Join-Path $directory 'heap-observations.jsonl'
          if (Test-Path -LiteralPath $observations) {
            Get-Content -LiteralPath $observations | ForEach-Object {
              [void]$processIds.Add([int]($_ | ConvertFrom-Json).process_id)
            }
          }
          $recording = Join-Path $directory 'recording.jsonl'
          if (Test-Path -LiteralPath $recording) {
            Write-Host '::group::recording.jsonl (long measurement process)'
            Get-Content -LiteralPath $recording | ForEach-Object {
              if ($processIds.Contains([int]($_ | ConvertFrom-Json).process_id)) { Write-Host $_ }
            }
            Write-Host '::endgroup::'
          }

      - name: Upload anonymous text only
        id: artifact
        if: always() && steps.publish.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-873-heap-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/issue-873-diagnosis/
          if-no-files-found: error
          retention-days: 14

      - name: Retry anonymous text upload
        if: always() && steps.artifact.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-873-heap-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/issue-873-diagnosis/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
