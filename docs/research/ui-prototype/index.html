<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>
  window.onerror = (m, src, line) => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999;background:#a00;color:#fff;padding:6px;font:12px monospace'; d.textContent = `JS 错误：${m} @ ${src?.split('/').pop()}:${line}`; document.body.appendChild(d); };
</script>
<title>列车经营 · UI 原型 第 4 轮</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>
<div id="app">
  <div id="game">
  <div id="map"><svg></svg></div>
  <div id="scene" class="hidden"></div>
  <div id="map-tools">
    <div class="stack">
      <button data-action="map-zoom" data-v="in" title="放大（滚轮）">${'+'}</button>
    </div>
  </div>
  <header id="topbar"></header>
  <nav id="rail" aria-label="主导航"></nav>
  <aside id="drawer" class="hidden"></aside>
  <aside id="inspector" class="hidden"></aside>
  <div id="workspace-host"></div>
  <div id="devdock" class="hidden"></div>
  </div>
  <div id="screen"></div>
  <div id="overlay"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="popovers"></div>
  <div id="dialog-host"></div>
  <div id="tooltip" class="hidden"></div>
  <div id="proto">
    <button data-action="pop" data-v="proto" title="原型控制，不属于游戏界面">原型</button>
    <div class="popover menu hidden">
      <div class="note">原型控制（不属于游戏界面）</div>
      <button data-action="proto-reset">重置原型</button>
      <button data-action="proto-toast">触发一条警告通知</button>
      <button data-action="proto-poor">把资金设为 800（看资金不足）</button>
      <button data-action="proto-rich">把资金设为 12,400</button>
      <button data-action="proto-battle">触发一场战斗</button>
      <button data-action="proto-surrender">让黑沙投降</button>
      <button data-action="proto-release">切换开发构建 / 玩家构建</button>
      <div class="note">跳到界面：</div>
      <div id="scenario-list" style="max-height:420px;overflow-y:auto"></div>
      <div class="note">主路径：点地图上的「青川」→ 车辆 → 勾选现车 → 购买并编组 → 编组并编辑计划 → 加停靠站和规则 → 保存并发车。</div>
    </div>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/data2.js"></script>
<script src="js/map.js"></script>
<script src="js/panels.js"></script>
<script src="js/workspaces.js"></script>
<script src="js/settlement.js"></script>
<script src="js/commission.js"></script>
<script src="js/combat.js"></script>
<script src="js/reports.js"></script>
<script src="js/shell.js"></script>
<script src="js/library.js"></script>
<script src="js/editor.js"></script>
<script src="js/devtools.js"></script>
<script src="js/authoring.js"></script>
<script src="js/app.js"></script>
<script src="js/scenarios.js"></script>
<script>
  // 地图缩放控件（静态部分）
  document.getElementById('map-tools').innerHTML = `
    <div class="stack"><button data-action="map-zoom" data-v="in" title="放大（滚轮）">${icon('plus')}</button><button data-action="map-zoom" data-v="out" title="缩小（滚轮）">${icon('minus')}</button></div>
    <button class="btn" data-action="map-fit" title="显示整个世界">${icon('fit')} 全图</button>
    <button class="btn" data-action="pop" data-v="layers" title="信息层与图例">${icon('layers')} 图层</button>`;
  document.getElementById('scenario-list').innerHTML = scenarioMenu();
  window.addEventListener('load', runScenario);
</script>
</body>
</html>
