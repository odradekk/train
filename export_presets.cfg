[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; 显式打包体素 JSON 和原始 PNG，供内容加载器读取。
; 四张内置贴图使用 importer=keep，使 FileAccess 在导出 PCK 中仍可读取原始字节。
