[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; 内容资产按 Keep File 打包原始字节；结构检查强制 builtin PNG/GLB 的导入方式。
include_filter="*.png,*.glb,Ui/Fonts/OFL.txt"
exclude_filter="archive/**,builds/**,TestResults/**,Tests/**,Contracts/**,prototypes/**,scripts/**,art-source/**,*.blend,*.blend1,examples/basic-through/recipe.json,examples/starting-trade/**,examples/storage-tight/**,examples/lease-expiry/**,examples/commission-branches/**,examples/rail-repair/**,examples/retreat/**,examples/damaged-vehicle-trade/**,examples/conquest/**,examples/clearance/**,examples/operating-failure/**,examples/long-consist/**,examples/standard-world/**,examples/standard-world-long/**,examples/busy-combat/**,examples/crowded-station/**,.mcp.json,global.json,addons/**,App/ArtCapture/**"
export_path="builds/train.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.6.0.0"
application/product_version="0.6.0"
application/company_name=""
application/product_name="Train"
application/file_description="Train core gameplay development build"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
ssh_remote_deploy/enabled=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

[preset.1]

name="Linux"
platform="Linux"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; 与 Windows Desktop 相同的过滤规则；目前只用于测试机器上的 Release 测量构建。
include_filter="*.png,*.glb,Ui/Fonts/OFL.txt"
exclude_filter="archive/**,builds/**,TestResults/**,Tests/**,Contracts/**,prototypes/**,scripts/**,art-source/**,*.blend,*.blend1,examples/basic-through/recipe.json,examples/starting-trade/**,examples/storage-tight/**,examples/lease-expiry/**,examples/commission-branches/**,examples/rail-repair/**,examples/retreat/**,examples/damaged-vehicle-trade/**,examples/conquest/**,examples/clearance/**,examples/operating-failure/**,examples/long-consist/**,examples/standard-world/**,examples/standard-world-long/**,examples/busy-combat/**,examples/crowded-station/**,.mcp.json,global.json,addons/**,App/ArtCapture/**"
export_path="builds/train.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
shader_baker/enabled=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
